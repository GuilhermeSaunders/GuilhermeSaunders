name: Update contribution heatmap

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Recife
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          # Optional PROFILE_TOKEN secret (a PAT) sees more contributions than the default token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_heatmap.py

      - name: Commit if changed
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution heatmap"
          git push
